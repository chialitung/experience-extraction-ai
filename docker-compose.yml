services:
  postgres:
    image: postgres:15-alpine
    container_name: eea-postgres
    environment:
      POSTGRES_USER: eea
      POSTGRES_DB: experience_extraction
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eea -d experience_extraction"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eea-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: eea-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eea-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eea-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://eea:${POSTGRES_PASSWORD}@postgres:5432/experience_extraction
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      DEBUG: "false"
      FRONTEND_BASE_URL: http://localhost:${FRONTEND_PORT:-8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eea-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eea-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - eea-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  eea-network:
    driver: bridge
